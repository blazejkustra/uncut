# Uncut telemetry proxy. Deploy steps: see the header comment in src/index.ts.
name = "uncut-telemetry"
main = "src/index.ts"
compatibility_date = "2026-09-15"
workers_dev = true
# Requests are never logged with bodies; keep Workers Logs off too.
observability = { enabled = false }

[vars]
GRAFANA_OTLP_URL = "https://otlp-gateway-prod-eu-north-0.grafana.net/otlp"
# Secrets (wrangler secret put): GRAFANA_INSTANCE_ID, GRAFANA_TOKEN, APP_TOKEN, optional APP_TOKEN_NEXT.
# The instance id isn't a credential, but it stays out of the public repo all the same.

# Per-IP limit: 60 requests per 60 s per Cloudflare location (period must be 10 or 60).
# A client batches up to 20 events every 10 s, so a normal app sends <= 6 requests a minute.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Daily unique users (D283): one random salt per UTC day, kept only here with a 26 h TTL, never a
# secret that lives longer. Create it with `wrangler kv namespace create VISITOR_SALTS` and put the
# printed id below, then uncomment (an id isn't a credential). Without this binding the Worker runs
# as before and adds no visitor_day.
[[kv_namespaces]]
binding = "VISITOR_SALTS"
id = "22ab73abe15c44fe89cab31848600ac5"
