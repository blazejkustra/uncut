<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Uncut</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="../../wireframe/wireframe.css" />
  <link rel="stylesheet" href="editor.css" />
  <script src="../../node_modules/lucide/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">Uncut</div>
      <button class="project-switch" id="open-project" title="Open another project">
        <span id="project-name">…</span><i data-lucide="chevron-down"></i>
      </button>
      <span class="save-state muted small" id="save-state"></span>
      <div class="topbar-spacer"></div>
      <button class="icon-btn" id="undo" title="Undo (⌘Z)"><i data-lucide="undo-2"></i></button>
      <button class="icon-btn" id="redo" title="Redo (⇧⌘Z)"><i data-lucide="redo-2"></i></button>
      <button class="btn primary" id="export-btn"><i data-lucide="download"></i>Export</button>
    </header>

    <nav class="rail" id="rail">
      <button data-lib="media" title="Media"><i data-lucide="film"></i><span>Media</span></button>
      <button data-lib="text" title="Text"><i data-lucide="type"></i><span>Text</span></button>
      <button data-lib="transitions" title="Transitions"><i data-lucide="blend"></i><span>Transitions</span></button>
    </nav>
    <aside class="library" id="library"></aside>

    <main class="stage">
      <div class="stage-canvas" id="stage-canvas">
        <div class="frame" id="frame" data-testid="preview-frame">
          <div class="layer" id="video-layer"></div>
          <div class="layer" id="text-layer"></div>
        </div>
      </div>
      <div class="transport">
        <span class="timecode" id="timecode">00:00:00</span>
        <div class="transport-mid">
          <button class="icon-btn" id="prev-frame" title="Back one frame (←)"><i data-lucide="skip-back"></i></button>
          <button class="icon-btn play" id="play" title="Play (Space)"><i data-lucide="play"></i></button>
          <button class="icon-btn" id="next-frame" title="Forward one frame (→)"><i data-lucide="skip-forward"></i></button>
        </div>
        <span class="muted small" id="canvas-info">…</span>
      </div>
    </main>

    <aside class="side" id="side">
      <div class="tabs">
        <button data-side="inspector">Inspector</button>
        <button data-side="agent">Agent</button>
      </div>
      <div class="side-body" id="side-body"></div>
    </aside>

    <section class="bottom" id="bottom">
      <div class="bottom-toolbar">
        <div class="seg"><button class="active">Timeline</button></div>
        <div class="tools">
          <button class="icon-btn" id="split" title="Split at playhead (S)"><i data-lucide="scissors"></i></button>
          <button class="icon-btn" id="delete" title="Delete (⌫)"><i data-lucide="trash-2"></i></button>
          <span class="sep"></span>
          <button class="icon-btn" id="zoom-out" title="Zoom out (−)"><i data-lucide="zoom-out"></i></button>
          <button class="icon-btn" id="zoom-fit" title="Fit (0)"><i data-lucide="scan"></i></button>
          <button class="icon-btn" id="zoom-in" title="Zoom in (+)"><i data-lucide="zoom-in"></i></button>
        </div>
      </div>
      <div class="bottom-body" id="bottom-body"></div>
    </section>
  </div>
  <div class="toast" id="toast" hidden></div>
  <script type="module" src="editor.js"></script>
</body>
</html>
