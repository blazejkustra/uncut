<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="../../wireframe/wireframe.css" />
  <link rel="stylesheet" href="editor.css" />
  <style>html, body { background: transparent !important; overflow: hidden; } .frame { position: absolute; inset: 0; border: 0; background: transparent; }</style>
</head>
<body>
  <!-- Export renders one text item at a time here, at full canvas size, on a transparent page. -->
  <div class="frame" id="frame"></div>
  <script type="module">
    import { textHtml } from "./render.js";
    window.show = (item, canvas) => {
      document.getElementById("frame").innerHTML = textHtml(item, canvas);
      return document.fonts.ready.then(() => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r))));
    };
    document.body.dataset.ready = "true";
  </script>
</body>
</html>
