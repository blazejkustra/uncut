<!doctype html>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Spike A: measure</title>
<style>body{margin:0;background:#111;color:#ddd;font:13px system-ui}video{width:960px;display:block}</style>
<video id="v" muted playsinline preload="auto"></video>
<pre id="out"></pre>
<script>
// Runs on demand from the test: window.measure(src) resolves with numbers.
const v = document.getElementById("v");
const once = (el, ev) => new Promise((r) => el.addEventListener(ev, r, { once: true }));
const frame = () => new Promise((r) => v.requestVideoFrameCallback((now, meta) => r(meta)));

async function support() {
  const out = { canPlay: {}, webcodecs: {} };
  for (const c of ["hvc1.2.4.L153.B0", "avc1.640028"]) {
    out.canPlay[c] = v.canPlayType(`video/mp4; codecs="${c}"`);
    try {
      out.webcodecs[c] = (await VideoDecoder.isConfigSupported({ codec: c, codedWidth: 3840, codedHeight: 2160, hardwareAcceleration: "prefer-hardware" })).supported;
    } catch (e) { out.webcodecs[c] = String(e); }
  }
  return out;
}

async function measure(src, { playSeconds = 5, seeks = 30 } = {}) {
  const result = { src, support: await support() };
  v.src = src;
  const ok = await Promise.race([once(v, "loadeddata").then(() => true), once(v, "error").then(() => false)]);
  if (!ok) return { ...result, error: v.error?.message ?? `media error ${v.error?.code}` };
  result.size = [v.videoWidth, v.videoHeight];
  result.duration = v.duration;

  // Playback: count presented frames over playSeconds.
  let presented = 0, stop = false;
  const tick = () => { presented++; if (!stop) v.requestVideoFrameCallback(tick); };
  v.requestVideoFrameCallback(tick);
  const q0 = v.getVideoPlaybackQuality();
  await v.play();
  const t0 = performance.now();
  await new Promise((r) => setTimeout(r, playSeconds * 1000));
  stop = true;
  v.pause();
  const elapsed = (performance.now() - t0) / 1000;
  const q1 = v.getVideoPlaybackQuality();
  result.playFps = +(presented / elapsed).toFixed(1);
  result.dropped = q1.droppedVideoFrames - q0.droppedVideoFrames;

  // Seeks: time from setting currentTime to the new frame being presented.
  const times = [];
  let seed = 7;
  const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < seeks; i++) {
    const target = rand() * (v.duration - 0.2);
    const s = performance.now();
    const shown = frame();
    v.currentTime = target;
    await shown;
    times.push(performance.now() - s);
  }
  times.sort((a, b) => a - b);
  result.seekMs = { median: +times[times.length >> 1].toFixed(1), p90: +times[Math.floor(times.length * 0.9)].toFixed(1), max: +times.at(-1).toFixed(1) };
  document.getElementById("out").textContent = JSON.stringify(result, null, 2);
  return result;
}
window.measure = measure;
window.support = support;
</script>
<video id="v2" muted playsinline preload="auto" style="position:fixed;right:0;top:0;width:480px"></video>
<script>
// Two clips playing at once, as during a dissolve. Counts frames presented by each.
window.measureDual = async (a, b, seconds = 5) => {
  const els = [document.getElementById("v"), document.getElementById("v2")];
  els[0].src = a; els[1].src = b;
  await Promise.all(els.map((el) => once(el, "loadeddata")));
  const counts = [0, 0]; let stop = false;
  els.forEach((el, i) => { const t = () => { counts[i]++; if (!stop) el.requestVideoFrameCallback(t); }; el.requestVideoFrameCallback(t); });
  const q0 = els.map((el) => el.getVideoPlaybackQuality().droppedVideoFrames);
  await Promise.all(els.map((el) => el.play()));
  const t0 = performance.now();
  await new Promise((r) => setTimeout(r, seconds * 1000));
  stop = true; els.forEach((el) => el.pause());
  const s = (performance.now() - t0) / 1000;
  return { fps: counts.map((c) => +(c / s).toFixed(1)), dropped: els.map((el, i) => el.getVideoPlaybackQuality().droppedVideoFrames - q0[i]) };
};
</script>
