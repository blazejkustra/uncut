appId: com.blazejkustra.uncut
productName: Uncut
electronVersion: 44.6.0
npmRebuild: false
# No auto-update feed and no publishing from electron-builder: the release workflow uploads the dmg itself.
publish: null
directories:
  output: ../../dist
files:
  - package.json
  - dist/**
extraResources:
  # Help › Licence and Help › Third-Party Notices open these (D112).
  - from: ../../LICENSE
    to: LICENSE.txt
  - from: ../../THIRD_PARTY_NOTICES
    to: THIRD_PARTY_NOTICES.txt
  # Electron's and Chromium's licences: electron-builder's mac output leaves them out of the bundle.
  - from: ../../node_modules/electron/dist/LICENSE
    to: licenses/LICENSE.electron.txt
  - from: ../../node_modules/electron/dist/LICENSES.chromium.html
    to: licenses/LICENSES.chromium.html
  - from: ../server/dist/server.mjs
    to: server/server.mjs
  # The agent's MCP server; the server starts it from next to itself (D40).
  - from: ../server/dist/mcp.mjs
    to: server/mcp.mjs
  - from: ../../native/media/target/release/uncut-media
    to: bin/uncut-media
  # The bundled DM Sans / DM Mono are inlined in the renderer and rasteriser (D77); graphics load the files (D198); their licence ships with them.
  - from: ../../assets/fonts
    to: fonts
    filter: ["*.woff2", "OFL.txt"]
  # The bundled CC0 sound-effects pack (D134): the sounds and library.json (titles, licences).
  - from: ../../assets/sfx
    to: sfx
    filter: ["*.m4a", "library.json"]
  # The libraries graphics load with uncut:lib/ markers (D193): three.js (MIT, its licence beside it) and Uncut's own.
  - from: ../../assets/graphic-libs
    to: graphic-libs
    filter: ["*.js", "*.LICENSE.txt"]
  # The server validates projects against these; schemas are bundled into server.mjs.
  - from: ../../spec/modules/builtin
    to: modules/builtin
    filter: ["*.json"]
  # Plugins (D97, D103, D258), laid out by the desktop build (scripts/build.ts → scripts/plugin-bundle.ts)
  # from plugins/bundled.json: the listed ones in Resources/plugins (installed and allowed from the start),
  # every other repo plugin in Resources/plugins/catalog (the marketplace in Settings › Plugins, install-only).
  # Only manifests and their code; never the _template or _shader-template (D104, D213).
  - from: stage/plugins
    to: plugins
    filter: ["*/uncut.module.json", "*/*.ts", "catalog/*/uncut.module.json", "catalog/*/*.ts", "!catalog/_*/**", "!**/*.test.ts", "!**/*.md"]
  # The plugin SDK (D102): plugins on the app's Node import "@uncut/plugin-sdk" from here.
  - from: ../../packages/plugin-sdk/src
    to: plugin-sdk
    filter: ["*.ts"]
  # The .uncut project icon (D252), named by Info.plist's CFBundleTypeIconFile and UTTypeIconFile below.
  - from: build/project.icns
    to: project.icns
# Pins the ad-hoc signature's designated requirement to the bundle id (see the script).
afterSign: scripts/after-sign.ts
mac:
  category: public.app-category.video
  icon: build/icon.icns
  # What macOS shows when the Capture tab first asks for the microphone or camera (D114); without
  # these macOS ends the app at the first request, ad-hoc or signed alike.
  extendInfo:
    NSMicrophoneUsageDescription: Uncut records voiceovers and the sound of camera and screen takes from your microphone.
    NSCameraUsageDescription: Uncut records camera takes for your videos.
    NSAudioCaptureUsageDescription: Uncut records the sound this Mac plays when you ask it to.
    # Not read by macOS today (screen recording asks with its own sheet); kept for the record (D247).
    NSScreenCaptureUsageDescription: Uncut records your screen or a window when you start a screen take.
    # D252: a Name.uncut project folder is a document package: Finder shows it as one item with the
    # project icon and double-clicking it opens Uncut (app.ts's open-file). Declared here rather than
    # with fileAssociations, which only knows extensions (no exported UTI conforming to com.apple.package).
    UTExportedTypeDeclarations:
      - UTTypeIdentifier: com.blazejkustra.uncut.project
        UTTypeDescription: Uncut Project
        UTTypeConformsTo: [com.apple.package, public.composite-content]
        UTTypeIconFile: project.icns
        UTTypeTagSpecification:
          public.filename-extension: [uncut]
    CFBundleDocumentTypes:
      - CFBundleTypeName: Uncut Project
        CFBundleTypeRole: Editor
        LSHandlerRank: Owner
        LSTypeIsPackage: true
        LSItemContentTypes: [com.blazejkustra.uncut.project]
        CFBundleTypeIconFile: project.icns
  # Ad-hoc signed ("-"), not Developer ID: Apple Silicon refuses to run an unsigned bundle,
  # and a real identity + notarization comes later. `pnpm dist:signed` (D114) overrides these
  # three on the command line: a keychain identity, the hardened runtime, build/signed.entitlements.plist.
  identity: "-"
  # The hardened runtime is for notarized Developer ID builds; ad-hoc + hardened runtime breaks
  # library validation for Electron's own frameworks.
  hardenedRuntime: false
  target:
    - target: dmg
      arch: arm64
    - target: dir
      arch: arm64
