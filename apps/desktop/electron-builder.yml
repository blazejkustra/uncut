appId: com.blazejkustra.uncut
productName: Uncut
electronVersion: 44.6.0
npmRebuild: false
directories:
  output: ../../dist
files:
  - package.json
  - dist/**
extraResources:
  - from: ../server/dist/server.mjs
    to: server/server.mjs
  # The agent's MCP server; the server starts it from next to itself (D40).
  - from: ../server/dist/mcp.mjs
    to: server/mcp.mjs
  - from: ../../native/media/target/release/uncut-media
    to: bin/uncut-media
  # The bundled DM Sans / DM Mono are inlined in the renderer and rasteriser (D77); their licence ships with them.
  - from: ../../assets/fonts/OFL.txt
    to: fonts/OFL.txt
  # The server validates projects against these; schemas are bundled into server.mjs.
  - from: ../../spec/modules/builtin
    to: modules/builtin
    filter: ["*.json"]
# Pins the ad-hoc signature's designated requirement to the bundle id (see the script).
afterSign: scripts/after-sign.ts
mac:
  category: public.app-category.video
  icon: build/icon.icns
  # Ad-hoc signed ("-"), not Developer ID: Apple Silicon refuses to run an unsigned bundle,
  # and a real identity + notarization comes later.
  identity: "-"
  # The hardened runtime is for notarized Developer ID builds; ad-hoc + hardened runtime breaks
  # library validation for Electron's own frameworks.
  hardenedRuntime: false
  target:
    - target: dmg
      arch: arm64
    - target: dir
      arch: arm64
