[package]
name = "uncut-media"
version = "0.0.1"
edition = "2021"
publish = false
license = "MIT"
description = "Uncut's media core: probing and frame access for the editor."
repository = "https://github.com/blazejkustra/uncut"

[[bin]]
name = "uncut-media"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.152"

[profile.release]
strip = true
