name: Bundled media tools
description: Builds native/tools/out (LGPL ffmpeg, ffprobe, whisper-cli), cached by their recipe.
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      id: tools
      with:
        path: native/tools/out
        key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/tools/*.ts') }}
    - if: steps.tools.outputs.cache-hit != 'true'
      shell: bash
      run: |
        brew install cmake meson ninja
        node native/tools/build.ts
