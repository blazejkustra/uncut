# Every push to main and every PR (#89, D254): the whole suite, typecheck + the fast tests + the
# packaged-app tests (test/app), split over 5 parallel macOS jobs. Each job builds the app itself,
# runs its fifth of the fast tests (node --test-shard), then its share of the app files
# (scripts/test-app-shard.ts, balanced by test/app/durations.json). 5 because GitHub runs at most 5
# macOS jobs at once on this plan: a 6th would only queue.
#
# Skipped on these runners, each with its reason in the log and the job summary
# (test/helpers/capabilities.ts): what needs a real GPU and media engine (preview = export pixel
# parity, playback smoothness and frame pacing, the WebGPU shaders' pixels; the runner is an Apple
# Virtualization VM with a paravirtual GPU), a real audio output (audible playback, the preview's
# mix vs the export's; the runner has "Apple Virtual Sound Device"), a screen bigger than the
# runner's 1024×674, the user's footage (UNCUT_FOOTAGE_DIR) and the real claude/argent CLIs.
#
# An app test file that fails is run once more (--retries 1). A pass on the retry still shows as a
# ::warning:: and as "flaky" in the job summary, so a flake is seen and fixed, never hidden.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Nightly too (was app-tests.yml): the same run on main, so a flake shows up without a push.
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

# A new push to a PR replaces its running check; every push to main finishes (D253), so a broken
# commit on main is always pinned down.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # pnpm's version comes from package.json's packageManager field (corepack).
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  test:
    name: tests ${{ matrix.shard }}/5
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      # 3 vCPUs: a launch or the first screen can take longer than on a laptop.
      UNCUT_TEST_LAUNCH_MS: "120000"
      # electron-builder skips signing on PRs; the app is only ad-hoc signed ("-", no certificate in
      # this workflow) and Apple silicon won't run it unsigned, nor verify a half-signed bundle.
      CSC_FOR_PULL_REQUEST: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - name: Find the pnpm store
        run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - name: Cache pnpm store, Electron, electron-builder and cargo
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PNPM_STORE }}
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/.cargo/registry
            native/media/target
          key: app-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'native/media/Cargo.lock') }}
          restore-keys: app-${{ runner.os }}-${{ runner.arch }}-
      # ffmpeg/ffprobe are the user's own install (not bundled); the media and export tests need them.
      - run: brew install ffmpeg
      - run: pnpm install --frozen-lockfile
      - name: Typecheck and licence notices
        if: matrix.shard == 1
        run: pnpm typecheck && node scripts/notices.ts --check
      # The fast tests start the bundled server and media core (pnpm build, part of dist); the app
      # tests launch the packaged app.
      - id: dist
        run: pnpm dist
      - name: Fast tests, shard ${{ matrix.shard }} of 5
        run: node --test --test-shard=${{ matrix.shard }}/5 "test/!(app)/**/*.test.ts"
      - name: App tests, shard ${{ matrix.shard }} of 5
        if: (success() || failure()) && steps.dist.outcome == 'success'
        run: node scripts/test-app-shard.ts --shard $(( ${{ matrix.shard }} - 1 )) --of 5 --retries 1
      - name: Keep the test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.shard }}
          path: |
            test-output/**/*.png
            test-output/shard-*.json
            test-output/skipped-checks.txt
          if-no-files-found: ignore
          retention-days: 7
