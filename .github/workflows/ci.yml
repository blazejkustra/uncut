# Typecheck and the fast tests (everything but the packaged-app tests) on every push and PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a PR replaces its running check; every push to main finishes (D253), so a broken
# commit on main is always pinned down.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # pnpm's version comes from package.json's packageManager field.
      - run: corepack enable
      - name: Find the pnpm store
        run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            native/media/target
          key: cargo-${{ runner.os }}-${{ hashFiles('native/media/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      # ffmpeg/ffprobe are the user's own install (not bundled); the media and export tests need them.
      - run: brew install ffmpeg
      - run: pnpm install --frozen-lockfile
      # The tests start the bundled server (apps/server/dist) and the media core (native/media, cargo).
      - run: pnpm build
      - run: node scripts/notices.ts --check
      - run: pnpm test:fast
