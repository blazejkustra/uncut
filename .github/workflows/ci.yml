# Every push to main and every PR (#89, D254): typecheck + the fast tests (everything but test/app),
# and the packaged-app tests (test/app) split over 4 parallel jobs, each building the app itself.
# Tests that need what GitHub's macOS VM doesn't have (a real GPU for preview = export pixel parity,
# a real audio device, a big screen, the footage, the real claude/argent) skip with their reason
# (test/helpers/capabilities.ts).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Nightly too (was app-tests.yml): the same run on main, so a flake shows up without a push.
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

# A newer push to the same branch or PR replaces the run in progress (main too: the repo is public,
# minutes are free, and the newest commit's result is the one that matters).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # pnpm's version comes from package.json's packageManager field (corepack).
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  test:
    name: typecheck + fast tests
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - name: Find the pnpm store
        run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - name: Cache pnpm store, Electron and cargo
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PNPM_STORE }}
            ~/Library/Caches/electron
            ~/.cargo/registry
            native/media/target
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'native/media/Cargo.lock') }}
          restore-keys: deps-${{ runner.os }}-${{ runner.arch }}-
      # ffmpeg/ffprobe are the user's own install (not bundled); the media and export tests need them.
      - run: brew install ffmpeg
      - run: pnpm install --frozen-lockfile
      # The tests start the bundled server (apps/server/dist) and the media core (native/media, cargo).
      - run: pnpm build
      - run: node scripts/notices.ts --check
      - run: pnpm test:fast
      - name: Keep the test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-fast
          path: test-output/
          if-no-files-found: ignore
          retention-days: 7

  app:
    name: app tests ${{ matrix.shard }}/4
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # 3 vCPUs: a launch or the first screen can take longer than on a laptop.
      UNCUT_TEST_LAUNCH_MS: "120000"
      # electron-builder skips signing on PRs; the app is only ad-hoc signed ("-", no certificate in
      # this workflow) and Apple silicon won't run it unsigned, nor verify a half-signed bundle.
      CSC_FOR_PULL_REQUEST: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - name: Find the pnpm store
        run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - name: Cache pnpm store, Electron, electron-builder and cargo
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PNPM_STORE }}
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/.cargo/registry
            native/media/target
          key: app-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'native/media/Cargo.lock') }}
          restore-keys: app-${{ runner.os }}-${{ runner.arch }}-
      - run: brew install ffmpeg
      - run: pnpm install --frozen-lockfile
      - name: Probe the runner (temporary)
        run: |
          sysctl -n kern.hv_vmm_present || true
          system_profiler SPHardwareDataType | grep -i model || true
          system_profiler SPDisplaysDataType || true
          system_profiler SPAudioDataType || true
          defaults read com.apple.universalaccess reduceMotion 2>&1 || true
      - run: pnpm dist
      - name: Run shard ${{ matrix.shard }} of 4
        run: node scripts/test-app-shard.ts --shard $(( ${{ matrix.shard }} - 1 )) --of 4
      - name: Keep the test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-app-${{ matrix.shard }}
          path: |
            test-output/**/*.png
            test-output/shard-*.json
            test-output/skipped-checks.txt
          if-no-files-found: ignore
          retention-days: 7
