# On a v* tag: the Developer ID-signed, notarized and stapled DMG, made by the same script as a local
# release (`pnpm dist:signed`, D247), kept as an artifact and attached to a draft release.
# Secrets: MACOS_CERT_P12 (the Developer ID Application certificate and key, .p12, base64),
# MACOS_CERT_PASSWORD, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (app-specific), and
# UNCUT_TELEMETRY_TOKEN (D223; without it the build's telemetry is inert).
# Auto-update (#102, D276): the release also gets the update zip, the blockmaps and latest-mac.yml;
# installed apps find them once the draft release is published (electron-updater's GitHub provider
# reads the latest published release, never a draft). So a tag without MACOS_CERT_P12 fails: a
# dmg-only release would become "latest" and leave signed users without an update feed. Without the
# certificate, run the workflow by hand (workflow_dispatch) for an ad-hoc dmg artifact, no release.
# Homebrew (#117): publishing the draft release runs the homebrew job, which renders the cask for the
# release's update zip (scripts/homebrew-cask.ts) and pushes it to blazejkustra/homebrew-tap
# (Casks/uncut.rb), for `brew install --cask blazejkustra/tap/uncut`. Secret: HOMEBREW_TAP_TOKEN
# (contents read and write on the tap repo); without it the job says so and does nothing.
name: Release

on:
  push:
    tags: ["v*"]
  # A draft published by hand: the cask follows (never on the draft, whose files brew can't download).
  release:
    types: [published]
  # By hand: without MACOS_CERT_P12 an ad-hoc dmg as an artifact (no release); with it, a signed one.
  # With cask_tag, only the cask for that published release (e.g. the first one, once the tap exists).
  workflow_dispatch:
    inputs:
      cask_tag:
        description: "Only push the Homebrew cask for this published release tag (e.g. v0.0.4); empty builds a dmg"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  dmg:
    if: github.event_name != 'release' && !inputs.cask_tag
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: A tag needs the certificate
        if: env.HAS_CERT != 'true' && github.ref_type == 'tag'
        run: |
          echo "::error::No MACOS_CERT_P12 secret: a release tag must be Developer ID-signed (a dmg-only release would break auto-update, D276). Add the signing secrets and re-run, or run the workflow by hand for an ad-hoc dmg."
          exit 1

      # A temporary keychain with the certificate and the notarytool profile; the script finds both
      # there (find-identity searches the keychain list; notarytool gets UNCUT_NOTARY_KEYCHAIN).
      # Not electron-builder's certificate variables: it would make its own keychain the script can't see.
      - name: Signing keychain
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/uncut-signing.keychain-db"
          KC_PASS="$(openssl rand -hex 24)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" > /dev/null
          # One argument per keychain already in the list (their paths have no spaces).
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          xcrun notarytool store-credentials uncut-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$KC"
          echo "UNCUT_NOTARY_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      # The app compares the feed's version with its own: the tag must be v<apps/desktop/package.json version>.
      - name: Tag matches the app version
        if: env.HAS_CERT == 'true' && github.ref_type == 'tag'
        run: |
          VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match apps/desktop/package.json version $VERSION (expected v$VERSION); auto-update would offer the wrong version."
            exit 1
          fi

      # Build, sign every binary, notarize and staple the app and the DMG, check them with stapler
      # and spctl, copy to release/Uncut-<version>-<YYYYMMDD>-arm64.dmg, with the auto-update feed
      # (Uncut-<version>-arm64-mac.zip, the .blockmap files, latest-mac.yml).
      - name: pnpm dist:signed
        if: env.HAS_CERT == 'true'
        env:
          UNCUT_NOTARY_PROFILE: uncut-notary
          UNCUT_TELEMETRY_TOKEN: ${{ secrets.UNCUT_TELEMETRY_TOKEN }}
        run: pnpm dist:signed

      - name: Ad-hoc dmg (no MACOS_CERT_P12; by hand only)
        if: env.HAS_CERT != 'true' && github.ref_type != 'tag'
        env:
          UNCUT_TELEMETRY_TOKEN: ${{ secrets.UNCUT_TELEMETRY_TOKEN }}
        run: |
          echo "::warning::No MACOS_CERT_P12 secret: an ad-hoc signed dmg, not notarized (other Macs warn)."
          pnpm build
          pnpm --filter @uncut/desktop exec electron-builder --config electron-builder.yml --publish never
          mkdir -p release && cp dist/*.dmg release/

      - uses: actions/upload-artifact@v4
        with:
          name: Uncut-dmg
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
      # A tag: the signed dmg plus the auto-update feed (zip, blockmaps, latest-mac.yml), as a draft.
      - name: Draft release
        if: env.HAS_CERT == 'true' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        # Uncut-arm64.dmg: the same dmg under a name that never changes, so the website's Download
        # button can link releases/latest/download/Uncut-arm64.dmg and start the download directly.
        run: |
          cp release/Uncut-*-*-arm64.dmg release/Uncut-arm64.dmg
          gh release create "$GITHUB_REF_NAME" release/*.dmg release/*.dmg.blockmap release/*-mac.zip release/*-mac.zip.blockmap release/latest-mac.yml --draft --title "Uncut $GITHUB_REF_NAME" --generate-notes
      - name: Remove the signing keychain
        if: always() && env.UNCUT_NOTARY_KEYCHAIN != ''
        run: security delete-keychain "$UNCUT_NOTARY_KEYCHAIN"

  # The cask for a published release: the zip's sha256, the cask rendered by the same script a
  # maintainer can run, committed to the tap if it changed. Not `needs: dmg`: the dmg job only drafts
  # the release, and a cask must never point at a draft's files, so this runs when it is published.
  # Only the latest published release (what livecheck and the update feed see): never a draft, a
  # prerelease or an older release published late (by hand too), so the cask never goes back. One
  # run at a time, so two pushes to the tap never race.
  homebrew:
    if: (github.event_name == 'release' && !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v')) || inputs.cask_tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false
    env:
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
      TAG: ${{ github.event.release.tag_name || inputs.cask_tag }}
    steps:
      - name: No HOMEBREW_TAP_TOKEN
        if: env.HAS_TAP_TOKEN != 'true'
        run: echo "::notice::No HOMEBREW_TAP_TOKEN secret, so the Homebrew cask was not updated. Add a token that can push to blazejkustra/homebrew-tap, then run this workflow by hand with cask_tag=$TAG."
      - uses: actions/checkout@v4
        if: env.HAS_TAP_TOKEN == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_TAP_TOKEN == 'true'
        with:
          node-version: 24
      - name: Render the cask
        id: render
        if: env.HAS_TAP_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${TAG#v}"
          LATEST="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [ "$TAG" != "$LATEST" ]; then
            echo "::notice::$TAG is not the latest published release ($LATEST), so the Homebrew cask was not updated."
            exit 0
          fi
          VERSION="${TAG#v}"
          gh release download "$TAG" --pattern "Uncut-$VERSION-arm64-mac.zip" --dir "$RUNNER_TEMP/cask"
          node scripts/homebrew-cask.ts --version "$TAG" --zip "$RUNNER_TEMP/cask/Uncut-$VERSION-arm64-mac.zip" --out "$RUNNER_TEMP/uncut.rb"
          cat "$RUNNER_TEMP/uncut.rb"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.render.outputs.tag
        with:
          repository: blazejkustra/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Push the cask to the tap
        if: steps.render.outputs.tag
        working-directory: tap
        env:
          TAG: ${{ steps.render.outputs.tag }}
        run: |
          mkdir -p Casks
          cp "$RUNNER_TEMP/uncut.rb" Casks/uncut.rb
          git add Casks/uncut.rb
          if git diff --cached --quiet; then
            echo "::notice::Casks/uncut.rb is already at $TAG."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "uncut ${TAG#v}"
          git push
