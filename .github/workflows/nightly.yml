# Uncut Nightly: a Developer ID-signed, notarized build of main every night there are new commits,
# published as a GitHub prerelease v<next patch>-nightly.<YYYYMMDD>.<run> (scripts/nightly-version.ts),
# to try a version before it is released, on any Mac, without a checkout: download the dmg from the
# release (Releases › the newest "Uncut Nightly"). It is its own app (apps/desktop/src/channel.ts,
# electron-builder.nightly.yml): Uncut Nightly, bundle id com.blazejkustra.uncut.nightly, its own icon
# and ~/Library/Application Support/Uncut Nightly, so it installs next to Uncut and never touches its
# data. It updates itself from the newest nightly (nightly-mac.yml); the release never sees nightlies
# (prereleases are never GitHub's latest release, which its updater, the website and the cask read).
# By hand (Actions › Nightly › Run workflow) it builds any branch the same way, e.g. before merging.
# Secrets: the release workflow's (MACOS_CERT_P12, MACOS_CERT_PASSWORD, APPLE_ID, APPLE_TEAM_ID,
# APPLE_APP_PASSWORD, UNCUT_TELEMETRY_TOKEN). The newest KEEP nightlies are kept, older ones deleted.
name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  # Temporary: a one-off nightly from this branch before nightly.yml is on main.
  push:
    branches: [nightly-try]

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  KEEP: 10

jobs:
  # A scheduled run builds only when main moved since the last nightly; a run by hand always builds.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          LAST="$(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '[.[].tagName | select(test("^v[0-9.]+-nightly\\."))][0] // ""')"
          if [ -n "$LAST" ] && [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$LAST" --jq .sha)" = "$GITHUB_SHA" ]; then
            echo "::notice::No commits since $LAST: no nightly tonight."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  nightly:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - name: A nightly needs the certificate
        if: env.HAS_CERT != 'true'
        run: |
          echo "::error::No MACOS_CERT_P12 secret: a nightly must be Developer ID-signed (to open on other Macs and to update itself)."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      # apps/desktop/package.json gets the nightly version (this checkout only): the build is Uncut Nightly.
      - name: Nightly version
        id: version
        run: node scripts/nightly-version.ts --run "$GITHUB_RUN_NUMBER" --write >> "$GITHUB_OUTPUT"

      # The same temporary keychain as release.yml's: the certificate and the notarytool profile.
      - name: Signing keychain
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/uncut-signing.keychain-db"
          KC_PASS="$(openssl rand -hex 24)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" > /dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          xcrun notarytool store-credentials uncut-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$KC"
          echo "UNCUT_NOTARY_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      # release/Uncut-Nightly-<version>-arm64.dmg and the nightly's update feed (zip, blockmaps, nightly-mac.yml).
      - name: pnpm dist:signed
        env:
          UNCUT_NOTARY_PROFILE: uncut-notary
          UNCUT_TELEMETRY_TOKEN: ${{ secrets.UNCUT_TELEMETRY_TOKEN }}
        run: pnpm dist:signed

      # A published prerelease (the updater never reads drafts), never marked latest. Its notes list
      # the changes since the previous nightly.
      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          PREV="$(gh release list --limit 100 --json tagName --jq '[.[].tagName | select(test("^v[0-9.]+-nightly\\."))][0] // ""')"
          NOTES="Uncut Nightly, built from \`$GITHUB_REF_NAME\` at $GITHUB_SHA. Not a release: it installs as a separate app (Uncut Nightly) next to Uncut, with its own data, and updates itself to newer nightlies."
          gh release create "$TAG" \
            release/*.dmg release/*.dmg.blockmap release/*-mac.zip release/*-mac.zip.blockmap release/nightly-mac.yml \
            --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Uncut Nightly $VERSION" --notes "$NOTES" \
            --generate-notes ${PREV:+--notes-start-tag "$PREV"}
          echo "### [Uncut Nightly $VERSION]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the newest ${{ env.KEEP }} nightlies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName --jq '.[].tagName | select(test("^v[0-9.]+-nightly\\."))' | tail -n +"$((KEEP + 1))" | while read -r tag; do
            gh release delete "$tag" --yes --cleanup-tag
          done

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Uncut-Nightly
          path: release/
          if-no-files-found: ignore
      - name: Remove the signing keychain
        if: always() && env.UNCUT_NOTARY_KEYCHAIN != ''
        run: security delete-keychain "$UNCUT_NOTARY_KEYCHAIN"
