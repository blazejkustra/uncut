# The packaged-app tests (test/app): build the unsigned app, then drive it. Slow, so by hand and nightly.
name: App tests

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  app:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: brew install ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist
      - run: pnpm test:app
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output/*.png
          if-no-files-found: ignore
          retention-days: 7
